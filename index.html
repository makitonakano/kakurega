<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAKUREGA カクレガ</title>
<meta name="description" content="観光地の外側にある、もう一つの景色。KAKUREGAは、そんな写真を一枚ずつ集めています。">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="KAKUREGA カクレガ">
<meta property="og:description" content="ひと駅先の、まだ見ぬ日本。">
<meta property="og:url" content="https://makitonakano.github.io/kakurega/">
<meta property="og:image" content="https://makitonakano.github.io/kakurega/img/l/tennozaki-park.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/title.woff2?v=575d8513" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=f880e0ab">
</head>
<body>
<header class="bar">
  <div class="left">
    <h1 class="brand"><a href="#gallery" id="brand"><span class="logo" lang="en">KAKUREGA</span><span class="kana">カクレガ</span></a></h1>
    <p class="caption" id="caption" aria-hidden="true"><span id="caption-a"></span><span class="b" id="caption-b"></span></p>
  </div>
  <nav class="tabs" data-t-label="tabs" aria-label="表示の切り替え">
    <a href="#gallery" data-tab="gallery" data-t-label="gallery" aria-label="写真">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h4.25l1.5-2.5h5.5l1.5 2.5h4.25v11.5h-17z"/><circle cx="12" cy="13" r="3.6"/></svg>
    </a>
    <a href="#map" data-tab="map" data-t-label="map" aria-label="地図">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5l5.5-2 6 2 5.5-2v13l-5.5 2-6-2-5.5 2zM9 4.5v13M15 6.5v13"/></svg>
    </a>
  </nav>
  <div class="lang">
    <button type="button" id="lang-button" popovertarget="lang-menu" aria-label="言語: 日本語">
      <span id="lang-current">日本語</span>
      <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>
    </button>
    <div id="lang-menu" popover></div>
  </div>
</header>

<main>
  <section id="view-gallery" data-t-label="gallery" aria-label="写真">
    <div class="season" id="season" hidden>
      <div class="season-body">
        <div class="season-stage" id="season-stage"></div>
        <div class="season-side season-left">
          <p class="season-place" id="season-a"></p>
        </div>
        <div class="season-side season-right">
          <p class="season-place b" id="season-b"></p>
        </div>
      </div>
      <div class="season-nav">
        <button type="button" id="season-prev" data-t-label="prev" aria-label="前の写真">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>
        </button>
        <p class="season-count"><span id="season-now">1</span> / <span id="season-total">1</span></p>
        <button type="button" id="season-next" data-t-label="next" aria-label="次の写真">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="hero" id="hero" hidden>
      <a class="hero-photo" id="hero-link" href="#gallery"><img id="hero-img" alt=""></a>
      <div class="hero-text">
        <p class="hero-sub" id="hero-sub"></p>
        <h2 class="hero-catch" data-t="catch">ひと駅先の、
まだ見ぬ日本。</h2>
        <p class="hero-about" id="hero-about"></p>
      </div>
    </div>
    <ul class="grid" id="grid"></ul>
  </section>
  <section id="view-map" data-t-label="map" aria-label="地図">
    <div id="map-canvas"></div>
    <div class="zoom">
      <button type="button" id="zoom-in" data-t-label="zoomIn" aria-label="拡大">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
      </button>
      <button type="button" id="zoom-out" data-t-label="zoomOut" aria-label="縮小">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
      </button>
    </div>
  </section>
</main>

<dialog id="viewer" data-t-label="photo" aria-label="写真">
  <button type="button" class="icon close" id="viewer-close" data-t-label="close" aria-label="閉じる">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <button type="button" class="icon prev" id="viewer-prev" data-t-label="prev" aria-label="前の写真">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <button type="button" class="icon next" id="viewer-next" data-t-label="next" aria-label="次の写真">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
  </button>
  <figure tabindex="-1" autofocus>
    <div class="stage" id="viewer-stage">
      <div class="slot"><div class="shot"><img alt="" decoding="async"></div></div>
      <div class="slot"><div class="shot"><img id="viewer-img" alt="" decoding="async"></div></div>
      <div class="slot"><div class="shot"><img alt="" decoding="async"></div></div>
      <button type="button" class="sound" id="sound" aria-pressed="false" hidden>
        <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9.5l5 5M21 9.5l-5 5"/></svg>
        <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
      </button>
    </div>
    <figcaption>
      <div class="caption-row">
        <p class="place"><a id="viewer-place" target="_blank" rel="noopener"><span id="viewer-a"></span><span class="b" id="viewer-b"></span></a></p>
        <a id="viewer-map" href="#map" data-t="map">地図</a>
      </div>
      <div class="music" id="viewer-music" hidden>
        <a class="music-chip" id="music-chip" target="_blank" rel="noopener">
          <img id="music-art" alt="">
          <span class="music-text"><span id="music-title"></span><span class="b" id="music-artist"></span></span>
          <span class="music-badge">Apple Music</span>
        </a>
      </div>
      <a class="credit" id="viewer-credit" target="_blank" rel="noopener" hidden></a>
    </figcaption>
  </figure>
</dialog>

<script src="i18n.js?v=bd05a711"></script>
<script src="data.js?v=dd183fb4"></script>
<script src="app.js?v=cc9fc566"></script>
</body>
</html>
